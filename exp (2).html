const FX_K='fxTablerosClave';
function fxB(s){ const r=atob(s), u=new Uint8Array(r.length); for(let i=0;i<r.length;i++) u[i]=r.charCodeAt(i); return u; }
async function fxDescifrar(P, clave){
  const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2', salt:fxB(P.s), iterations:P.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const comp=await crypto.subtle.decrypt({name:'AES-GCM', iv:fxB(P.iv)}, key, fxB(P.d));
  const st=new Blob([comp]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(st).text();
}
function fxGuardada(){ try{ return sessionStorage.getItem(FX_K) || localStorage.getItem(FX_K); }catch(e){ return null; } }
function fxGuardar(c, rec){ try{ sessionStorage.setItem(FX_K, c); if(rec) localStorage.setItem(FX_K, c); }catch(e){} }
function fxOlvidar(){ try{ sessionStorage.removeItem(FX_K); localStorage.removeItem(FX_K); }catch(e){} }

async function fxAbrir(c){ const html=await fxDescifrar(FX_P, c); document.open(); document.write(html); document.close(); }
(async()=>{
  const g=fxGuardada();
  if(g){ try{ await fxAbrir(g); return; }catch(e){ fxOlvidar(); } }
  document.getElementById('fxForm').addEventListener('submit', async ev=>{
    ev.preventDefault(); const c=document.getElementById('fxPass').value, b=document.getElementById('fxBtn'), er=document.getElementById('fxErr');
    b.disabled=true; er.textContent='';
    try{ const html=await fxDescifrar(FX_P, c); fxGuardar(c, document.getElementById('fxRec').checked); document.open(); document.write(html); document.close(); }
    catch(e){ er.textContent='Clave incorrecta'; b.disabled=false; }
  });
})();
</script></body></html>
