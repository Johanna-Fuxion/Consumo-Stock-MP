<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:linear-gradient(160deg,#043a5a 0%,#03304f 55%,#022640 100%);display:flex;align-items:center;justify-content:center;color:#0f1f2e}
.box{background:#fff;border-radius:16px;padding:30px 30px 26px;width:min(380px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.35);display:none}
.box.on{display:block}
.lk{width:46px;height:46px;border-radius:12px;background:#e2eef9;color:#0a64b4;display:grid;place-items:center;margin-bottom:14px}
.lk svg{width:24px;height:24px}
h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.3px}
p{margin:4px 0 18px;color:#7a8693;font-size:13px}
input{width:100%;height:40px;border:1px solid #c9d2dc;border-radius:9px;padding:0 12px;font:inherit;font-size:14px}
input:focus{outline:2px solid #0a64b4;outline-offset:0;border-color:#0a64b4}
button{margin-top:12px;width:100%;height:40px;border:0;border-radius:9px;background:#0a64b4;color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{min-height:18px;margin-top:10px;font-size:12.5px;color:#c03535}
.ld{color:#dbe6f1;font-size:13px}
</style>
</head>

  <h1>FuXion · Acceso restringido</h1>
  <p>Reportes FuXion · ingresa la clave de los tableros</p>
  <input type="password" id="pw" placeholder="Clave" aria-label="Clave" autocomplete="current-password">

  <div class="err" id="err"></div>
